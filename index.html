<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Tailwind CDN (Dočasné) -->

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Inter -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

    <!-- Javaskript -->

    <script src="script.js"></script>
</head>

<body style="font-family: Inter, sans-serif" class="font-sans bg-gray-700">

    <!-- Postranní menu -->

    <aside class="fixed">
        <div class="mr-3 pt-4 shadow-xl border-r-1 border-gray-400 bg-gray-200 h-screen w-[calc(100vw/6)]">
            <section class="_menu _menu-html shadow-lg h-auto ml-4 mr-4 rounded-lg bg-white">

                    <div class="h-auto bg-red-600 rounded-t-lg font-medium text-3xl tracking-tight text-gray-100 flex">
                        <h3 class="p-3 pl-6 pr-6">Přehled</h3>
                    </div>

                    <div class="h-[calc(100vh-108px)]">

                    </div>
                    <div class="h-4 bg-red-600 rounded-b-lg"></div>

            </section>

            <section class="_menu _menu-css shadow-lg h-auto ml-4 mr-4 rounded-lg bg-white hidden">

                    <div class="h-auto bg-blue-600 rounded-t-lg font-medium text-3xl tracking-tight text-gray-100 flex">
                        <h3 class="p-3 pl-6 pr-6">Přehled</h3>
                    </div>

                    <div class="h-[calc(100vh-108px)]">

                    </div>
                    <div class="h-4 bg-blue-600 rounded-b-lg"></div>

            </section>

            <section class="_menu _menu-js shadow-lg h-auto ml-4 mr-4 rounded-lg bg-white hidden">

                    <div class="h-auto bg-yellow-600 rounded-t-lg font-medium text-3xl tracking-tight text-gray-100 flex">
                        <h3 class="p-3 pl-6 pr-6">Přehled</h3>
                    </div>

                    <div class="h-[calc(100vh-108px)]">

                    </div>
                    <div class="h-4 bg-yellow-600 rounded-b-lg"></div>

            </section>
        </div>
    </aside>

    <!-- Hlavní část -->

    <main>
        <div class="ml-[calc(100vw/5.5)] m-auto border-l border-gray-400 bg-gray-200 h-auto">

            <!-- Nadpis a tlačítka -->

            <section class="p-10 pb-0 h-auto border-gray-400">
                <h1 class="pt-2 pb-2 underline tracking-tight text-gray-700 font-medium text-6xl">Návod k tvorbě webových stránek</h1>
                <div class="flex mt-10 tracking-tight text-gray-100 font-medium text-3xl">
                    <button id="button-html" onclick="showSection('html')" class="tlac tlac-html shadow-lg ml-10 bg-red-600 text-gray-100 rounded-lg hover:border-red-400 hover:text-red-400">
                        <h2 class="p-3 pr-6 pl-6">HTML</h2>
                    </button>
                    <button id="button-css" onclick="showSection('css')" class="tlac tlac-css bg-white shadow-lg ml-10 text-blue-600 rounded-lg hover:border-blue-400 hover:text-blue-400">
                        <h2 class="p-3 pr-6 pl-6">CSS</h2>
                    </button>
                    <button id="button-js" onclick="showSection('js')" class="tlac tlac-js bg-white shadow-lg ml-10 text-yellow-600 rounded-lg hover:border-yellow-400 hover:text-yellow-400">
                        <h2 class="p-3 pr-6 pl-6">JS</h2>
                    </button>
                </div>
            </section>

            <!-- HTML -->

            <section class="section html pb-10">

                <!-- Nadpis Sekce -->

                <div class="h-auto m-10 ml-20 mr-20 shadow-lg rounded-lg bg-red-600 tracking-tight text-gray-100 font-medium text-3xl w-max">
                    <h3 class="p-3 pl-6 pr-6">Základy HTML</h3>
                </div>

                <!-- Container Sekce -->
                <!-- U CSS a JS je to stejné (Nechce se mi to psát) -->
                
                <div class="shadow-lg h-auto mt-10 ml-20 mr-20 rounded-lg bg-white">
                    <div class="h-auto bg-red-600 rounded-t-lg font-medium text-3xl tracking-tight text-gray-100">
                        <h3 class="p-3 pl-6 pr-6">Placeholder</h3>
                    </div>
                    <div class="h-128 grid grid-cols-5">
                        <div class="col-span-3">

                        </div>
                        <div class="m-4 rounded-lg shadow-lg col-span-2">
                            <div class="h-auto bg-red-600 rounded-t-lg font-medium text-xl tracking-tight text-gray-100">
                                <h4 class="p-2 pl-6 pr-6">Ukázka Kódu</h4>
                            </div>
                            <div>
                            
                            </div>
                        </div>
                    </div>
                    <div class="h-4 bg-red-600 rounded-b-lg"></div>
                </div>


            </section>

            <!-- CSS -->

            <section class="section css pb-10 hidden">


                <div class="h-auto m-10 ml-20 mr-20 rounded-lg shadow-lg bg-blue-600 tracking-tight text-gray-100 font-medium text-3xl w-max">
                    <h3 class="p-3 pl-6 pr-6">Základy CSS</h3>
                </div>


                <div class="shadow-lg h-auto mt-10 ml-20 mr-20 rounded-lg bg-white">
                    <div class="h-auto bg-blue-600 rounded-t-lg font-medium text-3xl tracking-tight text-gray-100">
                        <h3 class="p-3 pl-6 pr-6">Placeholder</h3>
                    </div>
                    <div class="h-128 grid grid-cols-5">
                        <div class="col-span-3">

                        </div>
                        <div class="m-4 rounded-lg shadow-lg col-span-2">
                            <div class="h-auto bg-blue-600 rounded-t-lg font-medium text-xl tracking-tight text-gray-100">
                                <h4 class="p-2 pl-6 pr-6">Ukázka Kódu</h4>
                            </div>
                            <div>
                            
                            </div>
                        </div>
                    </div>
                    <div class="h-4 bg-blue-600 rounded-b-lg">

                    </div>
                </div>


            </section>

            <!-- JS -->

            <section class="section js pb-10 hidden">


                <div class="h-auto m-10 ml-20 mr-20 rounded-lg shadow-lg bg-yellow-600 tracking-tight text-gray-100 font-medium text-3xl w-max">
                    <h3 class="p-3 pl-6 pr-6">Základy JS</h3>
                </div>


                <div class="shadow-lg h-auto mt-10 ml-20 mr-20 rounded-lg bg-white">
                    <div class="h-auto bg-yellow-600 rounded-t-lg font-medium text-3xl tracking-tight text-gray-100">
                        <h3 class="p-3 pl-6 pr-6">Placeholder</h3>
                    </div>
                    <div class="h-128 grid grid-cols-5">
                        <div class="col-span-3">

                        </div>
                        <div class="m-4 rounded-lg shadow-lg col-span-2">
                            <div class="h-auto bg-yellow-600 rounded-t-lg font-medium text-xl tracking-tight text-gray-100">
                                <h4 class="p-2 pl-6 pr-6">Ukázka Kódu</h4>
                            </div>
                            <div>
                            
                            </div>
                        </div>
                    </div>
                    <div class="h-4 bg-yellow-600 rounded-b-lg">

                    </div>
                </div>


            </section>

            <!-- Zápatí (Nedodělané) -->

            <footer class="">
            
            </footer>
        </div>
    </main>
</body>
</html>
